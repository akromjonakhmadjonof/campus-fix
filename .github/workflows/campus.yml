name: CampusFix application
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: campus_fix_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/campus_fix_test
      RUN_DB_TESTS: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      STAFF_EMAIL: maintenance.demo@example.invalid
      STAFF_NAME: Demo Maintenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy && pnpm db:seed:locations && pnpm db:seed:locations
      - name: Create ephemeral fictional staff account
        run: |
          PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$PASSWORD"
          echo "STAFF_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          STAFF_PASSWORD="$PASSWORD" pnpm staff:create
      - name: Seed fictional browser-test fixtures in the disposable database
        run: pnpm db:seed:demo && pnpm db:seed:expanded
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm --filter @campus-fix/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campusfix-browser-evidence
          path: |
            web/test-results
            codex/screenshots
