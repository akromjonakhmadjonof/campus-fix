name: campus-fix-backend
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: campus_fix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./database/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_fix"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  postgres-test:
    image: postgres:18.6-bookworm
    profiles: [test]
    environment:
      POSTGRES_DB: campus_fix_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set TEST_POSTGRES_PASSWORD}
      MIGRATION_PASSWORD: ${TEST_MIGRATION_PASSWORD:?Set TEST_MIGRATION_PASSWORD}
      APP_DB_PASSWORD: ${TEST_APP_DB_PASSWORD:?Set TEST_APP_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql
      - ./database/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_fix_test"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  postgres-test-data:
